server {
    listen 80;
    server_name amirhoseainkhatami.ir www.amirhoseainkhatami.ir;
    
    # Document root for static files and error pages
    root C:/Users/labtob/Documents/python/ProjectManagerDashboard;
    
    # Static files
    location /static/ {
        alias C:/Users/labtob/Documents/python/ProjectManagerDashboard/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Media files
    location /media/ {
        alias C:/Users/labtob/Documents/python/ProjectManagerDashboard/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Main application
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Custom error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        root C:/Users/labtob/Documents/python/ProjectManagerDashboard/error_pages;
        internal;
    }
    
    location = /50x.html {
        root C:/Users/labtob/Documents/python/ProjectManagerDashboard/error_pages;
        internal;
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
}
