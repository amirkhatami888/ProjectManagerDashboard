<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست نمودار گانت</title>
    
    <!-- Bootstrap CSS RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.rtl.min.css">
    
    <!-- Frappe Gantt CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.css">
    
    <style>
        .gantt-container {
            direction: ltr;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .gantt .grid-background {
            fill: #f8f9fa;
        }
        
        .gantt .grid-header {
            fill: #ffffff;
            stroke: #e0e0e0;
        }
        
        .gantt .grid-row {
            fill: #ffffff;
            stroke: #e0e0e0;
        }
        
        .gantt .grid-row:nth-child(even) {
            fill: #f8f9fa;
        }
        
        .gantt .bar {
            fill: #4CAF50;
            stroke: #388E3C;
            stroke-width: 1;
            rx: 3;
            ry: 3;
        }
        
        .gantt .bar-progress {
            fill: #81C784;
        }
        
        .gantt .bar-invalid {
            fill: #FF5722;
            stroke: #D32F2F;
        }
        
        .gantt .bar-invalid ~ .bar-label {
            fill: #555;
        }
        
        .gantt .bar-label {
            fill: #fff;
            dominant-baseline: central;
            text-anchor: middle;
            font-size: 12px;
            font-weight: 500;
        }
        
        .gantt .bar-label.big {
            fill: #555;
            text-anchor: start;
        }
        
        .gantt .handle {
            fill: #ddd;
            cursor: ew-resize;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }
        
        .gantt .bar-wrapper {
            cursor: pointer;
            outline: none;
        }
        
        .gantt .bar-wrapper:hover .bar {
            opacity: 0.8;
        }
        
        .gantt .bar-wrapper:hover .handle {
            visibility: visible;
            opacity: 1;
        }
        
        .gantt .bar-wrapper.active .bar {
            opacity: 0.6;
        }
        
        .gantt .lower-text, .gantt .upper-text {
            font-size: 12px;
            text-anchor: middle;
        }
        
        .gantt .upper-text {
            fill: #555;
        }
        
        .gantt .lower-text {
            fill: #333;
        }
        
        .gantt .hide {
            display: none;
        }
        
        .gantt-container {
            position: relative;
            overflow: auto;
            font-size: 12px;
        }
        
        .gantt-container .popup-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(0, 0, 0, 0.8);
            padding: 0;
            color: #959da5;
            border-radius: 3px;
        }
        
        .gantt-container .popup-wrapper .title {
            border-bottom: 3px solid #a3a3ff;
            padding: 10px;
        }
        
        .gantt-container .popup-wrapper .subtitle {
            color: #dfe2e5;
            padding: 10px;
        }
        
        .gantt-container .popup-wrapper .pointer {
            position: absolute;
            height: 5px;
            margin: 0 0 0 -5px;
            border: 5px solid transparent;
            border-top-color: rgba(0, 0, 0, 0.8);
        }
        
        .gantt-container .grid-header {
            fill: #ffffff;
            stroke: #e0e0e0;
            stroke-width: 1.4;
        }
        
        .gantt-container .grid-row {
            fill: #ffffff;
        }
        
        .gantt-container .grid-row:nth-child(even) {
            fill: #f5f5f5;
        }
        
        .gantt-container .row-line {
            stroke: #ebeff2;
        }
        
        .gantt-container .tick {
            stroke: #e0e0e0;
            stroke-width: 0.2;
        }
        
        .gantt-container .tick.thick {
            stroke-width: 0.4;
        }
        
        .gantt-container .today-highlight {
            fill: #fcf8e3;
            opacity: 0.5;
        }
        
        .gantt-container .arrow {
            fill: none;
            stroke: #666;
            stroke-width: 1.4;
        }
        
        .gantt-container .arrow:hover {
            stroke: #333;
        }
    </style>
</head>
<body>
    <div class="container-fluid my-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0">تست نمودار گانت</h5>
                    </div>
                    <div class="card-body">
                        <div id="gantt-chart-container" style="height: 400px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Frappe Gantt JS -->
    <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.umd.js"></script>
    
    <!-- Moment.js -->
    <script src="https://cdn.jsdelivr.net/npm/moment"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log("🚀 Starting Gantt test...");
            
            // Test data
            const tasks = [
                {
                    id: 'Task 1',
                    name: 'زیرپروژه ۱',
                    start: '2024-01-01',
                    end: '2024-03-31',
                    progress: 50,
                    dependencies: []
                },
                {
                    id: 'Task 2',
                    name: 'زیرپروژه ۲',
                    start: '2024-04-01',
                    end: '2024-06-30',
                    progress: 25,
                    dependencies: ['Task 1']
                },
                {
                    id: 'Task 3',
                    name: 'زیرپروژه ۳',
                    start: '2024-07-01',
                    end: '2024-09-30',
                    progress: 75,
                    dependencies: ['Task 2']
                }
            ];
            
            // Gantt configuration
            const config = {
                header_height: 50,
                column_width: 30,
                step: 24,
                view_modes: ['Quarter Day', 'Half Day', 'Day', 'Week', 'Month'],
                view_mode: 'Month',
                date_format: 'YYYY-MM-DD',
                language: 'fa',
                arrow_curve: 6,
                padding: 18,
                bar_height: 40,
                bar_corner_radius: 3,
                bar_progress: true,
                bar_progress_color: '#aaa',
                bar_progress_opacity: 0.3,
                arrow_color: '#ccc',
                row_height: 44,
                today_color: 'rgba(252, 248, 227, 0.5)',
                Tooltip_width: 200,
                Tooltip_template: function (start, end, task) {
                    return '<div class="gantt-tooltip">' +
                        '<div class="gantt-tooltip-title">' + task.name + '</div>' +
                        '<div class="gantt-tooltip-content">' +
                        '<div>شروع: ' + moment(start).format('YYYY/MM/DD') + '</div>' +
                        '<div>پایان: ' + moment(end).format('YYYY/MM/DD') + '</div>' +
                        '<div>پیشرفت: ' + task.progress + '%</div>' +
                        '</div></div>';
                }
            };
            
            try {
                console.log("📊 Creating Gantt chart with tasks:", tasks);
                console.log("⚙️ Gantt config:", config);
                
                // Check if Gantt library is loaded
                if (typeof Gantt === 'undefined') {
                    throw new Error("Frappe Gantt library not loaded");
                }
                
                console.log("✅ Gantt library loaded successfully");
                
                // Create the Gantt chart
                const gantt = new Gantt('#gantt-chart-container', tasks, config);
                console.log("✅ Gantt chart created successfully:", gantt);
                
                // Add click event
                gantt.bind('click', function(task) {
                    console.log("Clicked on task:", task);
                    alert('کلیک روی: ' + task.name);
                });
                
            } catch (error) {
                console.error("❌ Error creating Gantt chart:", error);
                document.getElementById('gantt-chart-container').innerHTML = 
                    '<div class="alert alert-danger"><strong>خطا در ایجاد نمودار گانت</strong><br>' +
                    'خطا: ' + error.message + '<br>' +
                    '<button class="btn btn-primary btn-sm mt-2" onclick="location.reload()">بارگذاری مجدد</button></div>';
            }
        });
    </script>
</body>
</html>
