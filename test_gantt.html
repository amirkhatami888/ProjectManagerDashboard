<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست نمودار گانت</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="static/css/gantt-persian.css">
    <style>
        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">تست نمودار گانت</h1>
        
        <div class="row mb-3">
            <div class="col-12">
                <div class="alert alert-info">
                    <strong>راهنمای تست:</strong>
                    <ul class="mb-0 mt-2">
                        <li>این صفحه برای تست نمودار گانت طراحی شده است</li>
                        <li>در صورت عدم بارگذاری کتابخانه اصلی، نسخه ساده نمایش داده می‌شود</li>
                        <li>از دکمه‌های زیر برای تست استفاده کنید</li>
                    </ul>
                </div>
            </div>
        </div>
        
        <div class="row mb-3">
            <div class="col-12">
                <button id="test-gantt-btn" class="btn btn-primary me-2">
                    <i class="bi bi-play-circle"></i> تست نمودار گانت
                </button>
                <button id="debug-btn" class="btn btn-warning me-2">
                    <i class="bi bi-bug"></i> عیب‌یابی
                </button>
                <button id="retry-btn" class="btn btn-secondary">
                    <i class="bi bi-arrow-clockwise"></i> تلاش مجدد
                </button>
            </div>
        </div>
        
        <div id="gantt-chart-container" style="height: 400px; border: 1px solid #dee2e6; border-radius: 6px;">
            <div class="gantt-loading">
                <div class="spinner"></div>
                <span>در حال بارگذاری...</span>
            </div>
        </div>
        
        <div class="mt-3">
            <h5>اطلاعات تست:</h5>
            <div id="test-info" class="alert alert-light">
                برای شروع تست، روی دکمه "تست نمودار گانت" کلیک کنید.
            </div>
        </div>
    </div>

    <script src="static/js/gantt-fix.js"></script>
    <script>
        // Test data
        const testSubprojects = [
            {
                id: 1,
                name: "فونداسیون",
                start: "2024-01-01",
                end: "2024-03-31",
                progress: 75,
                relationshipType: "مستقل",
                hasContract: true,
                contractAmount: 1000000,
                imagenaryDuration: 90
            },
            {
                id: 2,
                name: "اسکلت فلزی",
                start: "2024-04-01",
                end: "2024-07-31",
                progress: 50,
                relationshipType: "بعد از",
                relatedId: 1,
                relationshipDelay: 0,
                hasContract: true,
                contractAmount: 2000000,
                imagenaryDuration: 120
            },
            {
                id: 3,
                name: "نازک‌کاری",
                start: "2024-08-01",
                end: "2024-11-30",
                progress: 25,
                relationshipType: "بعد از",
                relatedId: 2,
                relationshipDelay: 0,
                hasContract: false,
                contractAmount: null,
                imagenaryDuration: 120
            }
        ];

        // Test button
        document.getElementById('test-gantt-btn').addEventListener('click', function() {
            console.log('🧪 Testing Gantt chart...');
            document.getElementById('test-info').innerHTML = 'در حال تست نمودار گانت...';
            
            if (window.GanttChartManager) {
                window.GanttChartManager.initialize(testSubprojects, 1).then(() => {
                    document.getElementById('test-info').innerHTML = '✅ تست نمودار گانت با موفقیت انجام شد!';
                }).catch(error => {
                    document.getElementById('test-info').innerHTML = `❌ خطا در تست: ${error.message}`;
                });
            } else {
                document.getElementById('test-info').innerHTML = '❌ GanttChartManager در دسترس نیست';
            }
        });

        // Debug button
        document.getElementById('debug-btn').addEventListener('click', function() {
            console.log('🐛 Debugging...');
            if (window.debugGanttStatus) {
                const debugInfo = window.debugGanttStatus();
                document.getElementById('test-info').innerHTML = `
                    <strong>اطلاعات عیب‌یابی:</strong><br>
                    Gantt Library Loaded: ${debugInfo.ganttLibraryLoaded}<br>
                    Gantt CSS Loaded: ${debugInfo.ganttCSSLoaded}<br>
                    Gantt Available: ${debugInfo.ganttAvailable}<br>
                    Manager Available: ${debugInfo.windowGanttChartManager}
                `;
            } else {
                document.getElementById('test-info').innerHTML = '❌ تابع عیب‌یابی در دسترس نیست';
            }
        });

        // Retry button
        document.getElementById('retry-btn').addEventListener('click', function() {
            console.log('🔄 Retrying...');
            if (window.retryGanttLoad) {
                window.retryGanttLoad();
                document.getElementById('test-info').innerHTML = '🔄 در حال تلاش مجدد...';
            } else {
                location.reload();
            }
        });

        // Auto-test on page load
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 Page loaded, waiting for GanttChartManager...');
            
            const checkManager = (attempt = 0) => {
                if (window.GanttChartManager) {
                    console.log('✅ GanttChartManager ready');
                    document.getElementById('test-info').innerHTML = '✅ GanttChartManager آماده است. برای شروع تست کلیک کنید.';
                } else if (attempt < 20) {
                    setTimeout(() => checkManager(attempt + 1), 200);
                } else {
                    document.getElementById('test-info').innerHTML = '❌ GanttChartManager بارگذاری نشد';
                }
            };
            
            checkManager();
        });
    </script>
</body>
</html>
